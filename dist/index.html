<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#eeeae2"><meta name="description" content="Friday — a story in images and fragments."><title>Friday — Bande Dessinée</title><link rel="preload" as="image" href="assets/rain-walk.png"><link rel="stylesheet" href="style.css"></head><body><div class="progress" aria-hidden="true"><span id="progress-fill"></span></div><header class="masthead"><a class="brand" href="#friday">Friday</a><nav aria-label="Chapters"><a href="#friday">Friday</a><a href="#saturday">Saturday</a><a href="#sunday">Sunday</a><a href="#later">Later</a></nav></header><main><section id="friday" class="chapter"><header class="chapter-title"><span>01</span><h2>Friday</h2></header><div class="sequence wide"><figure class="panel"><div class="art"><img src="assets/rain-walk.png" alt="A lone man walks home through a rainy city." fetchpriority="high"></div><figcaption><span class="time">7:00 PM</span><p>It was supposed to be summer. An endless November followed me home.</p></figcaption></figure></div><div class="sequence wide"><figure class="panel"><div class="art"><img src="assets/doner-shop.png" alt="A man looks at his phone in a döner shop while a woman watches from another table." loading="lazy" decoding="async"></div><figcaption><span class="time">9:30 PM</span><p>A woman sits a few metres away. I lower my eyes and return to my screen. Tomorrow.</p></figcaption></figure></div><div class="sequence wide"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-2" viewBox="8 8 1518 401"><title id="art-2">The man sits alone looking out at rain and tram lights.</title><image href="assets/friday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">11:30 PM</span><p>Rain at the window. The room is cold. I keep wandering, without moving.</p></figcaption></figure></div><div class="sequence dream"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-3" viewBox="8 425 752 585"><title id="art-3">The man lies in bed imagining a knight, dragon and princess.</title><image href="assets/friday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">2:00 AM</span><p>Since childhood, I have told myself stories to fall asleep. The princesses became real women.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-4" viewBox="779 425 746 585"><title id="art-4">In his fantasy, the man raises a beer while a woman smiles at him.</title><image href="assets/friday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">In the story</span><p>She sees through my cheerful charade. A fleeting smile, and I belong somewhere.</p></figcaption></figure></div></section><section id="saturday" class="chapter"><header class="chapter-title"><span>02</span><h2>Saturday</h2></header><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-5" viewBox="8 8 748 487"><title id="art-5">The man hugs his pillow in bed.</title><image href="assets/saturday-morning.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">11:00 AM</span><p>I hold the pillow like a lover. Her warmth lingers. Outside, only rain.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-6" viewBox="768 8 760 487"><title id="art-6">He opens an empty fridge beside coffee, supplements and a silent phone.</title><image href="assets/saturday-morning.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">12:30 PM</span><p>No messages. No food. Coffee and pills. Thirteen hours before bed again.</p></figcaption></figure></div><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-7" viewBox="8 507 748 503"><title id="art-7">The man stands at his apartment window.</title><image href="assets/saturday-morning.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">Before leaving</span><p>I tell myself this room is a choice. Style. Comfort. Splendid isolation.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-8" viewBox="768 507 760 503"><title id="art-8">Through the window, he watches people going out together.</title><image href="assets/saturday-morning.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">Across the street</span><p>Behind the glass, I watch people step into lives I never join.</p></figcaption></figure></div><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-9" viewBox="12 12 780 475"><title id="art-9">The man grips his shirt as sunshine breaks through the clouds.</title><image href="assets/saturday-day.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">2:00 PM</span><p>I chose imaginary company. The price is loneliness. Then, suddenly, the sky clears.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-10" viewBox="808 12 710 475"><title id="art-10">A smiling waitress brings his usual bagel and coffee.</title><image href="assets/saturday-day.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">2:15 PM</span><p>“The usual?” A smile, a nod. Recognition is almost a conversation.</p></figcaption></figure></div><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-11" viewBox="12 505 808 501"><title id="art-11">He wanders alone beneath an umbrella in the heat.</title><image href="assets/saturday-day.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">4:30 PM</span><p>From terrace to terrace. Watching people. Burning quietly in the sun.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-12" viewBox="839 505 679 501"><title id="art-12">He writes at a café table with his phone in hand.</title><image href="assets/saturday-day.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">Three poems</span><p>I could choose to call someone. But what if they don’t answer?</p></figcaption></figure></div><div class="sequence wide"><figure class="panel"><div class="art"><img src="assets/lovers-become-trees.png" alt="An elderly couple holds hands beneath a tree whose branches become embracing lovers." loading="lazy" decoding="async"></div><figcaption><span class="time">9:00 PM</span><p>Her head rests on his shoulder. I imagine them taking root, keeping each other company across countless seasons.</p></figcaption></figure></div><div class="sequence night"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-14" viewBox="768 8 760 487"><title id="art-14">An empty park path under dim street lamps.</title><image href="assets/saturday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">11:30 PM</span><p>The paths empty. The trees disappear into blackness.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-15" viewBox="12 531 751 477"><title id="art-15">An imagined accident: a hand and phone beside a car tyre.</title><image href="assets/saturday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">A passing thought</span><p>A sudden accident. A lit phone on the asphalt. I wish I had more time.</p></figcaption></figure></div><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-16" viewBox="780 529 365 478"><title id="art-16">He climbs a narrow dark wooden staircase.</title><image href="assets/saturday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">1:00 AM</span><p>For a second, I hope to meet a neighbour. The second passes.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-17" viewBox="1152 534 366 467"><title id="art-17">He sleeps with his phone on his chest while rain hits the window.</title><image href="assets/saturday-night.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">Back in bed</span><p>My daily streak survives. I fall asleep with the phone on my chest.</p></figcaption></figure></div></section><section id="sunday" class="chapter"><header class="chapter-title"><span>03</span><h2>Sunday</h2></header><div class="sequence wide"><figure class="panel"><div class="art"><img src="assets/winter-room.png" alt="The man faces a large window engulfed by a blizzard." loading="lazy" decoding="async"></div><figcaption><span class="time">7:00 AM</span><p>A blizzard covers the window. Outside, no one. The cold has become a world.</p></figcaption></figure></div><div class="sequence narrow"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-19" viewBox="768 8 760 487"><title id="art-19">He shivers on the couch beside dusty glasses and an empty fridge.</title><image href="assets/sunday-flashbacks.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">10:00 AM</span><p>No food. No pills. No Internet. Dust settles over everything I called home.</p></figcaption></figure></div><div class="sequence memory"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-20" viewBox="12 521 763 488"><title id="art-20">A remembered conversation with a woman at a sunny café.</title><image href="assets/sunday-flashbacks.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">11:30 AM · A memory</span><p>Once, in a café, I asked to join her. She said yes. We spoke for an hour. Then she left.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-21" viewBox="800 521 720 488"><title id="art-21">He imagines an intimate dinner with the woman among friends.</title><image href="assets/sunday-flashbacks.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">1:00 PM · A fantasy</span><p>Another table. Another life. Her eyes locked on mine, as though nothing else mattered.</p></figcaption></figure></div><div class="sequence absence"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-22" viewBox="13 10 700 497"><title id="art-22">The man lies awake in bed looking at the ceiling.</title><image href="assets/sunday-later.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">3:30 PM</span><p>Nothing left to carry me into tomorrow. Alone, with no one calling, I vanish.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-23" viewBox="13 10 700 497"><title id="art-23">The same room and bed, now empty.</title><image href="assets/sunday-later-empty.png" width="1536" height="1024" /></svg></div><figcaption><span class="time"></span><p>Not even a shadow.</p></figcaption></figure></div></section><section id="later" class="chapter"><header class="chapter-title"><span>04</span><h2>Later</h2></header><div class="sequence wide"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-24" viewBox="731 11 790 495"><title id="art-24">Couples walk and embrace beneath leafy trees near busy terraces.</title><image href="assets/sunday-later.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">September</span><p>The city is warm again. Lovers make their promises. Some will become trees.</p></figcaption></figure></div><div class="sequence pair"><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-25" viewBox="13 526 811 479"><title id="art-25">An estate agent welcomes parents and their child into the apartment.</title><image href="assets/sunday-later.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">New arrivals</span><p>The agent opens the door to a family. They love the couch, the windows, the old-fashioned charm.</p></figcaption></figure><figure class="panel"><div class="art"><svg role="img" aria-labelledby="art-26" viewBox="846 526 674 479"><title id="art-26">The new father sits with coffee and a pill box, surrounded by his family.</title><image href="assets/sunday-later.png" width="1536" height="1024" /></svg></div><figcaption><span class="time">At home</span><p>The father takes his vitamins and smiles. He feels at home.</p></figcaption></figure></div></section></main><footer><a href="#friday">Friday</a><span>A story in images &amp; fragments</span></footer><script src="script.js" defer></script></body></html>
